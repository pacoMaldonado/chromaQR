[package]
name = "chromaqr"
version = "0.0.4"
description = "High-performance cross-platform desktop QR code generator and customizer"
authors = ["Javier Maldonado Hernández"]
license = "MIT"
repository = "https://github.com/pacoMaldonado/chromaQR"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chromaqr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
